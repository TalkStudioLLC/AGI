server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Resolve the backend lazily per request via Docker's embedded DNS.
        # With a literal proxy_pass hostname, nginx refuses to start when the
        # backend container is absent — which would break frontend-only mode
        # (docker compose --profile frontend up). With a variable, nginx
        # starts regardless and returns 502 on /api until a backend appears.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;   # long-running run polling headroom
    }

    location / {
        try_files $uri /index.html;
    }
}
