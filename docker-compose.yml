# AGI repo — root Docker Compose
# Canonical compose file for the repo. Run from C:\Users\Tom\Documents\GitHub\AGI.
#
# Profiles (the frontend/backend flags):
#   docker compose up --build                        → full sr-lab stack (default via .env)
#   docker compose --profile backend  up --build     → backend only (API on :8000)
#   docker compose --profile frontend up --build     → frontend only (nginx on :5173)
#   docker compose --profile full     up --build     → both, explicit
#   docker compose --profile memory   build          → build the F3IL memory MCP image
#
# The CLI --profile flag overrides the COMPOSE_PROFILES=full default in .env.
# Frontend-only works even with no backend container: nginx resolves the
# backend lazily per request (see sr-lab/frontend/nginx.conf) and returns
# 502 on /api until a backend is reachable.
#
# NOTE on the memory service: it is BUILD-ONLY here. MCP servers talk
# JSON-RPC over stdio, and Claude Desktop spawns the process itself — so the
# container is launched by Claude Desktop via `docker run -i --rm ...`
# (see MEMORY_SYSTEM_FIXED.md v3.1), not by `compose up`. Use this profile
# to (re)build the image:  docker compose --profile memory build

services:
  backend:
    build: ./sr-lab/backend
    container_name: sr-lab-backend
    profiles: ["full", "backend"]
    volumes:
      - srlab-data:/app/data      # DuckDB persists across container rebuilds
      # real-world experiment datasets: drop CSVs here on the host, restart backend
      - ./sr-lab/backend/data/real:/app/data/real:ro
      # protected datasets (EXP-007+): gitignored AND dockerignored — reaches the
      # container only through this read-only mount, never via image or git
      - ./sr-lab/backend/data/private:/app/data/private:ro
    # joblib memmaps training arrays into /dev/shm during parallel search;
    # Docker's 64MB default starves the workers (SIGSEGV). Give it room.
    shm_size: "1gb"
    environment:
      # Where the backend PUSHES metrics. Reachable by service name on the
      # compose network. Metrics are fully optional: if this gateway is down
      # or unset the backend logs a debug line and serves normally.
      - PUSHGATEWAY_URL=http://pushgateway:9091
      # Where the backend feeds MEMORY organically. When a run discovers a
      # held-out-verified law that beats the prior best, it POSTs it here so
      # F3!L remembers it. Fully optional and fail-safe: if unset or the
      # bridge is down, the write is skipped and the run is unaffected.
      - MEMORY_API_URL=http://memory-api:4300
    ports:
      - "8000:8000"               # published for frontend-dev against dockerized API
    restart: unless-stopped

  # Prometheus Pushgateway — receives pushes from batch-style SR runs and holds
  # them for Prometheus to scrape. Lives with the app it serves; the external
  # Prometheus scrapes it via the published host port (host.docker.internal:9091).
  pushgateway:
    image: prom/pushgateway:latest
    container_name: sr-lab-pushgateway
    profiles: ["full", "backend"]
    ports:
      - "9091:9091"
    restart: unless-stopped

  frontend:
    build: ./sr-lab/frontend
    container_name: sr-lab-frontend
    profiles: ["full", "frontend"]
    ports:
      - "5173:80"                 # http://localhost:5173
    restart: unless-stopped

  memory:
    build:
      context: .
      dockerfile: Dockerfile.memory
    image: agi-memory-server
    profiles: ["memory"]          # build-only; launched by Claude Desktop, not compose
    stdin_open: true              # documents the stdio contract for manual testing:
    volumes:                      #   docker compose --profile memory run --rm memory
      - .:/data

  # HTTP bridge over the SAME MemoryManager/memory.db the MCP server uses, so
  # the (Python) SR-lab backend can feed memory organically. Runs the F3IL
  # image with the HTTP entrypoint instead of the stdio one. Mounts the repo
  # root to /data so it shares memory.db + the embedding model cache with F3!L,
  # meaning laws written here are recall-able in Claude Desktop.
  memory-api:
    build:
      context: .
      dockerfile: Dockerfile.memory
    image: agi-memory-server
    container_name: sr-lab-memory-api
    profiles: ["full", "backend"]
    command: ["node", "memory-http.js"]
    environment:
      - MEMORY_HTTP_PORT=4300
    volumes:
      - .:/data                   # same memory.db + .model-cache as F3!L
    ports:
      - "4300:4300"
    restart: unless-stopped

volumes:
  srlab-data:
